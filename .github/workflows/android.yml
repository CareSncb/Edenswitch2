name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Variante (standard = Eden, optimized = Eden Optimized / Android 15+, legacy = anciens GPU)"
        type: choice
        default: standard
        options: [standard, optimized, legacy]
  push:
    branches: [master, main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools

      - name: Build
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t "${{ github.event.inputs.flavor || 'standard' }}" -b Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-${{ github.event.inputs.flavor || 'standard' }}
          path: |
            artifacts/*.apk
            src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
